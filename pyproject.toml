[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "document-extraction-engine"
version = "0.1.0"
description = "Configurable, model-agnostic document extraction to Markdown with source references."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pymupdf>=1.24,<2",
  "pillow>=10.0",
  "pyyaml>=6.0.1",
  "google-genai>=0.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "ruff>=0.4",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests", "eval"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "live: memerlukan API key dan provider sungguhan; tidak dijalankan default",
  "browser: memerlukan browser/Playwright; tidak dijalankan default",
  "docker: memerlukan Docker Compose; tidak dijalankan default",
]
